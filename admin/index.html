<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case desk | Departed Digital</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="theme-color" content="#1a2744" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1a2744;
      --navy-dark: #111b35;
      --gold: #c9a84c;
      --gold-light: #e0c06a;
      --paper: #f7f4ee;
      --white: #ffffff;
      --text: #2d3a4a;
      --muted: #6b7a8d;
      --border: #e2dccf;
      --green: #3e7a5e;
      --amber: #a5772f;
      --red: #a5443a;
      --radius: 14px;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--paper);
      color: var(--text);
      line-height: 1.6;
      font-size: 15px;
    }
    h1, h2, h3 { font-family: 'Playfair Display', Georgia, serif; color: var(--navy); font-weight: 600; }
    button { font-family: inherit; font-size: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

    /* Top bar */
    .topbar {
      background: var(--navy-dark);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: sticky;
      top: 0;
      z-index: 60;
    }
    .topbar-logo {
      font-family: 'Playfair Display', serif;
      color: var(--white);
      font-size: 1.1rem;
      text-decoration: none;
    }
    .topbar-logo span { color: var(--gold); }
    .topbar-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
    .topbar-user { color: rgba(255,255,255,0.6); font-size: 0.85rem; }
    .link-btn { white-space: nowrap; }
    @media (max-width: 480px) {
      .topbar { padding: 12px 16px; gap: 12px; }
      .topbar-user { display: none; }
      .topbar-right { gap: 12px; }
    }
    .link-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.72);
      font-size: 0.85rem;
      text-decoration: underline;
      padding: 4px;
    }
    .link-btn:hover { color: var(--gold-light); }

    .wrap { max-width: 1240px; margin: 0 auto; padding: 26px 24px 80px; }

    /* Login */
    .login-card {
      max-width: 380px;
      margin: 80px auto;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
    }
    .login-card h1 { font-size: 1.5rem; margin-bottom: 6px; }
    .login-card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 22px; }
    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--white);
    }
    .field textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: 2px solid var(--gold);
      outline-offset: -1px;
      border-color: var(--gold);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 20px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--navy);
      font-weight: 600;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover { border-color: var(--gold); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--navy-dark);
    }
    .btn-primary:hover { background: var(--gold-light); border-color: var(--gold-light); }
    .btn-block { width: 100%; }
    .btn-sm { padding: 7px 14px; font-size: 0.85rem; font-weight: 500; }

    .notice {
      padding: 11px 14px;
      border-radius: 9px;
      font-size: 0.88rem;
      margin-bottom: 16px;
      border: 1px solid;
    }
    .notice-error { background: #fbf0ef; border-color: #e6c8c4; color: var(--red); }
    .notice-success { background: #eef5f1; border-color: #c6ded1; color: var(--green); }
    .notice-info { background: #f2f0e9; border-color: var(--border); color: var(--muted); }
    .notice[hidden] { display: none; }

    /* Tabs */
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--text);
      font-weight: 500;
    }
    .tab.active { background: var(--navy); border-color: var(--navy); color: var(--white); }
    .tab .count {
      min-width: 22px;
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(26,39,68,0.08);
      font-size: 0.78rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .tab.active .count { background: rgba(255,255,255,0.18); color: var(--white); }
    .tab.attention .count { background: var(--gold); color: var(--navy-dark); }

    .toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .toolbar input[type="search"] {
      flex: 1;
      min-width: 240px;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--white);
    }

    /* Case list */
    .case-list { display: flex; flex-direction: column; gap: 10px; }
    .case-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      width: 100%;
      text-align: left;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .case-row:hover { border-color: var(--gold); box-shadow: 0 4px 16px rgba(26,39,68,0.07); }
    .case-row.is-attention { border-left: 4px solid var(--gold); }
    .case-main { min-width: 0; }
    .case-name { display: block; font-weight: 600; color: var(--navy); font-size: 1.02rem; }
    .case-meta { display: block; color: var(--muted); font-size: 0.86rem; margin-top: 2px; }
    .case-meta .ref { font-variant-numeric: tabular-nums; }
    .case-side { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .pill {
      display: inline-block;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .pill-attention { background: #f6efdc; color: var(--amber); border-color: #e6d5a8; }
    .pill-waiting { background: #eef1f6; color: var(--muted); border-color: #dbe1ea; }
    .pill-done { background: #eef5f1; color: var(--green); border-color: #c6ded1; }
    .pill-unpaid { background: #f3f1ec; color: var(--muted); border-color: var(--border); }
    .pill-blocked { background: #fbf0ef; color: var(--red); border-color: #e6c8c4; }
    .pill-ref { background: var(--white); color: var(--muted); border-color: var(--border); font-weight: 500; }

    .empty {
      background: var(--white);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 46px 24px;
      text-align: center;
      color: var(--muted);
    }
    .empty strong { display: block; color: var(--navy); font-size: 1.05rem; margin-bottom: 6px; font-family: 'Playfair Display', serif; }

    /* Detail panel */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(17,27,53,0.45);
      z-index: 80;
      display: none;
    }
    .overlay.open { display: block; }
    .panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(680px, 100vw);
      background: var(--paper);
      z-index: 90;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.22s ease;
      box-shadow: -8px 0 40px rgba(17,27,53,0.18);
    }
    .panel.open { transform: translateX(0); }
    @media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
    .panel-head {
      position: sticky;
      top: 0;
      background: var(--navy-dark);
      color: var(--white);
      padding: 20px 26px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      z-index: 2;
    }
    .panel-head h2 { color: var(--white); font-size: 1.3rem; }
    .panel-head .sub { color: rgba(255,255,255,0.6); font-size: 0.86rem; margin-top: 3px; }
    .panel-close {
      background: none;
      border: 1px solid rgba(255,255,255,0.25);
      color: var(--white);
      border-radius: 999px;
      width: 32px;
      height: 32px;
      font-size: 1.1rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .panel-close:hover { border-color: var(--gold); color: var(--gold); }
    .panel-body { padding: 24px 26px 60px; }
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      margin-bottom: 16px;
    }
    .card h3 {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      font-family: 'Inter', sans-serif;
      margin-bottom: 14px;
    }
    .next-action { border-left: 4px solid var(--gold); }
    .next-action p { margin-bottom: 14px; color: var(--text); }
    .next-action .btn { margin-right: 8px; margin-bottom: 8px; }

    dl.facts { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 9px 16px; font-size: 0.92rem; }
    dl.facts dt { color: var(--muted); }
    dl.facts dd { color: var(--text); word-break: break-word; }
    dl.facts dd a { color: var(--navy); }

    ul.plain { list-style: none; display: flex; flex-direction: column; gap: 9px; }
    ul.plain li { font-size: 0.92rem; }
    .doc-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .doc-row a { color: var(--navy); font-weight: 500; }
    .doc-row .doc-meta { color: var(--muted); font-size: 0.82rem; white-space: nowrap; }

    details.advanced { margin-top: 4px; }
    details.advanced summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 0.88rem;
      padding: 8px 0;
      list-style: none;
    }
    details.advanced summary::-webkit-details-marker { display: none; }
    details.advanced summary::before { content: "▸ "; }
    details.advanced[open] summary::before { content: "▾ "; }
    details.advanced summary:hover { color: var(--navy); }

    .activity-item { font-size: 0.86rem; padding: 7px 0; border-bottom: 1px solid var(--border); }
    .activity-item:last-child { border-bottom: none; }
    .activity-item .when { color: var(--muted); }

    .skeleton { color: var(--muted); padding: 30px 0; text-align: center; }
    [hidden] { display: none !important; }

    @media (max-width: 620px) {
      .wrap { padding: 20px 16px 60px; }
      .case-row { grid-template-columns: 1fr; gap: 10px; }
      .case-side { justify-content: flex-start; }
      .panel-body { padding: 18px 18px 50px; }
      dl.facts { grid-template-columns: 1fr; gap: 3px; }
      dl.facts dt { margin-top: 8px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="/" class="topbar-logo">Departed<span>.</span>Digital</a>
    <div class="topbar-right">
      <span class="topbar-user" id="session-user"></span>
      <button type="button" class="link-btn" id="refresh-btn" hidden>Refresh</button>
      <button type="button" class="link-btn" id="signout-btn" hidden>Sign out</button>
    </div>
  </div>

  <!-- Login -->
  <div class="login-card" id="login-view">
    <h1>Case desk</h1>
    <p>Sign in to see cases that need you.</p>
    <div class="notice notice-error" id="login-error" hidden></div>
    <form id="login-form">
      <div class="field">
        <label for="login-username">Username</label>
        <input id="login-username" type="text" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-submit">Sign in</button>
    </form>
  </div>

  <!-- Desk -->
  <div class="wrap" id="desk-view" hidden>
    <div class="notice notice-error" id="desk-error" hidden></div>

    <div class="tabs" id="tabs">
      <button type="button" class="tab active attention" data-tab="attention">Needs you <span class="count" data-count="attention">0</span></button>
      <button type="button" class="tab" data-tab="waiting">Waiting <span class="count" data-count="waiting">0</span></button>
      <button type="button" class="tab" data-tab="done">Done <span class="count" data-count="done">0</span></button>
      <button type="button" class="tab" data-tab="unpaid">Unpaid <span class="count" data-count="unpaid">0</span></button>
    </div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Search name, reference, or email" aria-label="Search cases" />
    </div>

    <div id="case-list" class="case-list"></div>
  </div>

  <!-- Case detail -->
  <div class="overlay" id="overlay"></div>
  <aside class="panel" id="panel" aria-hidden="true">
    <div class="panel-head">
      <div>
        <h2 id="panel-title">Case</h2>
        <div class="sub" id="panel-sub"></div>
      </div>
      <button type="button" class="panel-close" id="panel-close" aria-label="Close">&times;</button>
    </div>
    <div class="panel-body" id="panel-body">
      <div class="skeleton">Loading case…</div>
    </div>
  </aside>

<script>
(function () {
  'use strict';

  var SESSION_KEY = 'departedDigitalAdminSession';
  var state = {
    token: '',
    session: null,
    cases: [],
    tab: 'attention',
    search: '',
    selected: null
  };

  var el = function (id) { return document.getElementById(id); };

  function escapeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function readToken() {
    try { return localStorage.getItem(SESSION_KEY) || ''; } catch (e) { return ''; }
  }
  function writeToken(token) {
    try {
      if (token) localStorage.setItem(SESSION_KEY, token);
      else localStorage.removeItem(SESSION_KEY);
    } catch (e) { /* private mode */ }
  }

  function headers() {
    var h = { 'Content-Type': 'application/json' };
    if (state.token) h['X-Admin-Session'] = state.token;
    return h;
  }

  async function api(path, options) {
    var response = await fetch(path, Object.assign({ headers: headers() }, options || {}));
    var raw = await response.text();
    var data = {};
    try { data = raw ? JSON.parse(raw) : {}; } catch (e) { data = {}; }
    if (!response.ok) {
      var message = data.error || data.message || ('Request failed (' + response.status + ')');
      var err = new Error(message);
      err.status = response.status;
      throw err;
    }
    return data;
  }

  function formatDate(value) {
    if (!value) return '';
    var d = new Date(value);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function formatDateTime(value) {
    if (!value) return '';
    var d = new Date(value);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  function formatSize(bytes) {
    var n = Number(bytes) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function daysSince(value) {
    if (!value) return null;
    var then = new Date(value);
    if (isNaN(then.getTime())) return null;
    return Math.floor((Date.now() - then.getTime()) / 86400000);
  }

  // A case belongs to exactly one lane. The lane decides what Steven sees and
  // which single action the panel offers.
  function laneFor(item) {
    if (item.archivedAt) return 'done';
    var status = item.status || '';
    var paid = item.paymentStatus === 'paid';

    if (status === 'completed') return 'done';
    if (!paid && status === 'awaiting_payment') return 'unpaid';
    if (status === 'blocked') return 'attention';
    if (status === 'documents_received' || status === 'paid') return 'attention';
    if (Number(item.documentCount) > 0 && status !== 'submitted' && status !== 'active') return 'attention';
    if (status === 'awaiting_documents' || status === 'submitted' || status === 'active') return 'waiting';
    return paid ? 'attention' : 'unpaid';
  }

  function laneLabel(item) {
    var lane = laneFor(item);
    if (item.status === 'blocked') return { text: 'Blocked', cls: 'pill-blocked' };
    if (lane === 'attention') {
      if (Number(item.documentCount) > 0) return { text: 'Documents in', cls: 'pill-attention' };
      return { text: 'Ready to start', cls: 'pill-attention' };
    }
    if (lane === 'waiting') {
      if (item.status === 'submitted' || item.status === 'active') return { text: 'With platforms', cls: 'pill-waiting' };
      return { text: 'Waiting on family', cls: 'pill-waiting' };
    }
    if (lane === 'done') return { text: 'Completed', cls: 'pill-done' };
    return { text: 'Not paid', cls: 'pill-unpaid' };
  }

  function filteredCases() {
    var term = state.search.trim().toLowerCase();
    return state.cases.filter(function (item) {
      if (laneFor(item) !== state.tab) return false;
      if (!term) return true;
      return [item.clientName, item.deceasedName, item.reference, item.clientEmail]
        .some(function (v) { return String(v || '').toLowerCase().indexOf(term) !== -1; });
    });
  }

  function renderCounts() {
    var counts = { attention: 0, waiting: 0, done: 0, unpaid: 0 };
    state.cases.forEach(function (item) {
      var lane = laneFor(item);
      if (counts[lane] !== undefined) counts[lane] += 1;
    });
    Object.keys(counts).forEach(function (key) {
      var node = document.querySelector('[data-count="' + key + '"]');
      if (node) node.textContent = counts[key];
    });
  }

  var EMPTY_COPY = {
    attention: ['Nothing needs you right now', 'When a family sends documents, or a new case is paid for, it appears here.'],
    waiting: ['Nothing waiting', 'Cases sit here while a family gathers documents or a platform processes a request.'],
    done: ['No completed cases yet', 'Cases you mark as completed are kept here for reference.'],
    unpaid: ['No unpaid cases', 'People who start the form but do not pay show up here, so you can follow up if you want to.']
  };

  function renderList() {
    renderCounts();
    var list = el('case-list');
    var items = filteredCases();

    if (!items.length) {
      var copy = state.search.trim()
        ? ['No cases match that search', 'Try a name, a case reference, or an email address.']
        : (EMPTY_COPY[state.tab] || ['Nothing here', '']);
      list.innerHTML = '<div class="empty"><strong>' + escapeHtml(copy[0]) + '</strong>' + escapeHtml(copy[1]) + '</div>';
      return;
    }

    items.sort(function (a, b) {
      return new Date(b.updatedAt || b.createdAt || 0) - new Date(a.updatedAt || a.createdAt || 0);
    });

    list.innerHTML = items.map(function (item) {
      var label = laneLabel(item);
      var age = daysSince(item.updatedAt || item.createdAt);
      var meta = [];
      if (item.deceasedName) meta.push('for ' + escapeHtml(item.deceasedName));
      if (item.packageLabel) meta.push(escapeHtml(item.packageLabel));
      if (age !== null) meta.push(age === 0 ? 'updated today' : 'updated ' + age + (age === 1 ? ' day ago' : ' days ago'));

      var referral = item.referralPartnerName
        ? '<span class="pill pill-ref">via ' + escapeHtml(item.referralPartnerName) + '</span>' : '';
      var docs = Number(item.documentCount) > 0
        ? '<span class="pill pill-ref">' + item.documentCount + ' doc' + (item.documentCount === 1 ? '' : 's') + '</span>' : '';

      return '<button type="button" class="case-row' + (laneFor(item) === 'attention' ? ' is-attention' : '') + '" data-case-id="' + escapeHtml(item.id) + '">' +
        '<span class="case-main">' +
          '<span class="case-name">' + escapeHtml(item.clientName || 'Unnamed client') + '</span>' +
          '<span class="case-meta"><span class="ref">' + escapeHtml(item.reference || '') + '</span>' +
            (meta.length ? ' &middot; ' + meta.join(' &middot; ') : '') + '</span>' +
        '</span>' +
        '<span class="case-side">' + docs + referral +
          '<span class="pill ' + label.cls + '">' + escapeHtml(label.text) + '</span>' +
        '</span>' +
      '</button>';
    }).join('');
  }

  // The single action the case is waiting for, by lane.
  function nextActionFor(item) {
    var status = item.status || '';
    if (status === 'blocked') {
      return { text: 'This case is blocked. Once you have resolved it, put it back into progress.',
               label: 'Unblock and continue', status: 'active' };
    }
    if (Number(item.documentCount) > 0 && status !== 'submitted' && status !== 'active') {
      return { text: 'Documents are in. Review them, then submit the requests to each platform.',
               label: 'Submitted to platforms', status: 'submitted' };
    }
    if (status === 'paid' || status === 'documents_received') {
      return { text: 'Paid and ready. The family can upload documents from their case page.',
               label: 'Waiting on documents', status: 'awaiting_documents' };
    }
    if (status === 'awaiting_documents') {
      return { text: 'Waiting for the family to send documents. Nothing to do unless it has been a while.',
               label: 'Documents received', status: 'documents_received' };
    }
    if (status === 'submitted' || status === 'active') {
      return { text: 'Submitted to the platforms. Chase them until every account is resolved.',
               label: 'Mark completed', status: 'completed' };
    }
    if (status === 'awaiting_payment') {
      return { text: 'This person started a case but has not paid. Their case link still works if they come back.',
               label: '', status: '' };
    }
    return { text: 'This case is complete.', label: '', status: '' };
  }

  function renderPanel(record) {
    var body = el('panel-body');
    var action = nextActionFor(record);
    var docs = Array.isArray(record.documents) ? record.documents : [];
    var activity = Array.isArray(record.activity) ? record.activity.slice(0, 8) : [];
    var links = record.caseLinks || {};

    var html = '';

    // Next action
    html += '<div class="card next-action">' +
      '<h3>Next step</h3>' +
      '<p>' + escapeHtml(action.text) + '</p>';
    if (action.label) {
      html += '<button type="button" class="btn btn-primary" id="action-primary" data-status="' + escapeHtml(action.status) + '">' + escapeHtml(action.label) + '</button>';
    }
    if (record.status !== 'blocked' && record.status !== 'completed' && record.paymentStatus === 'paid') {
      html += '<button type="button" class="btn btn-sm" id="action-block">Mark blocked</button>';
    }
    html += '<div class="notice notice-success" id="action-note" hidden></div>';
    html += '</div>';

    // Facts
    html += '<div class="card"><h3>The case</h3><dl class="facts">' +
      '<dt>Client</dt><dd>' + escapeHtml(record.clientName || '') +
        (record.clientEmail ? '<br /><a href="mailto:' + escapeHtml(record.clientEmail) + '">' + escapeHtml(record.clientEmail) + '</a>' : '') + '</dd>' +
      '<dt>Deceased</dt><dd>' + escapeHtml(record.deceasedName || 'Not given') + '</dd>' +
      '<dt>Relationship</dt><dd>' + escapeHtml(record.relationshipToDeceased || 'Not given') + '</dd>' +
      '<dt>Package</dt><dd>' + escapeHtml(record.packageLabel || record.selectedPackage || '') + '</dd>' +
      '<dt>Payment</dt><dd>' + escapeHtml(record.paymentStatus === 'paid' ? 'Paid' : 'Not paid') + '</dd>' +
      '<dt>Platforms named</dt><dd>' + escapeHtml(record.knownPlatforms || 'None given') + '</dd>' +
      (record.profileUrls ? '<dt>Profile links</dt><dd>' + escapeHtml(record.profileUrls) + '</dd>' : '') +
      (record.referralSource ? '<dt>Came from</dt><dd>' + escapeHtml(record.referralSource) + '</dd>' : '') +
      '<dt>Started</dt><dd>' + escapeHtml(formatDate(record.createdAt)) + '</dd>' +
    '</dl></div>';

    // Documents
    html += '<div class="card"><h3>Documents (' + docs.length + ')</h3>';
    if (!docs.length) {
      html += '<p style="color: var(--muted); font-size: 0.92rem;">Nothing uploaded yet.</p>';
    } else {
      html += '<ul class="plain">' + docs.map(function (doc) {
        var url = '/api/admin/cases?id=' + encodeURIComponent(record.id) + '&download=' + encodeURIComponent(doc.id);
        return '<li class="doc-row">' +
          '<a href="#" data-download="' + escapeHtml(url) + '" data-filename="' + escapeHtml(doc.fileName || 'document') + '">' + escapeHtml(doc.fileName || 'Document') + '</a>' +
          '<span class="doc-meta">' + escapeHtml(doc.documentType || '') + ' &middot; ' + escapeHtml(formatSize(doc.size)) + '</span>' +
        '</li>';
      }).join('') + '</ul>';
    }
    html += '</div>';

    // Notes
    html += '<div class="card"><h3>Your notes</h3>' +
      '<div class="field"><textarea id="notes-input" placeholder="Anything you need to remember about this case">' + escapeHtml(record.internalNotes || '') + '</textarea></div>' +
      '<button type="button" class="btn btn-sm" id="notes-save">Save notes</button>' +
      '<div class="notice notice-success" id="notes-note" hidden></div>' +
    '</div>';

    // Client link
    if (links.caseUrl) {
      html += '<div class="card"><h3>Their case page</h3>' +
        '<p style="font-size: 0.9rem; color: var(--muted); margin-bottom: 12px;">The private link the family uses to upload documents and follow progress.</p>' +
        '<button type="button" class="btn btn-sm" id="copy-link" data-link="' + escapeHtml(links.caseUrl) + '">Copy link</button>' +
        '<span id="copy-note" style="margin-left: 10px; font-size: 0.85rem; color: var(--green);"></span>' +
      '</div>';
    }

    // Advanced
    html += '<div class="card"><details class="advanced"><summary>Advanced</summary>' +
      '<div class="field" style="margin-top:12px;"><label for="status-select">Status (override)</label>' +
      '<select id="status-select">' +
        ['awaiting_payment','paid','awaiting_documents','documents_received','active','submitted','completed','blocked'].map(function (s) {
          return '<option value="' + s + '"' + (record.status === s ? ' selected' : '') + '>' + s.replace(/_/g, ' ') + '</option>';
        }).join('') +
      '</select></div>' +
      '<button type="button" class="btn btn-sm" id="status-save">Save status</button>';
    if (activity.length) {
      html += '<h3 style="margin-top:22px;">Recent activity</h3>' + activity.map(function (entry) {
        return '<div class="activity-item">' + escapeHtml(String(entry.event || '').replace(/_/g, ' ')) +
          ' <span class="when">' + escapeHtml(formatDateTime(entry.at || entry.createdAt)) + '</span></div>';
      }).join('');
    }
    html += '</details></div>';

    body.innerHTML = html;
    bindPanel(record);
  }

  function bindPanel(record) {
    var primary = el('action-primary');
    if (primary) {
      primary.addEventListener('click', function () {
        saveCase(record.id, { status: primary.dataset.status }, primary, 'action-note', 'Updated');
      });
    }

    var blockBtn = el('action-block');
    if (blockBtn) {
      blockBtn.addEventListener('click', function () {
        saveCase(record.id, { status: 'blocked' }, blockBtn, 'action-note', 'Marked blocked');
      });
    }

    var notesSave = el('notes-save');
    if (notesSave) {
      notesSave.addEventListener('click', function () {
        saveCase(record.id, { internalNotes: el('notes-input').value }, notesSave, 'notes-note', 'Notes saved', true);
      });
    }

    var statusSave = el('status-save');
    if (statusSave) {
      statusSave.addEventListener('click', function () {
        saveCase(record.id, { status: el('status-select').value }, statusSave, 'action-note', 'Status updated');
      });
    }

    var copyBtn = el('copy-link');
    if (copyBtn) {
      copyBtn.addEventListener('click', async function () {
        try {
          await navigator.clipboard.writeText(copyBtn.dataset.link);
          el('copy-note').textContent = 'Copied';
          setTimeout(function () { el('copy-note').textContent = ''; }, 2000);
        } catch (e) {
          el('copy-note').textContent = 'Press Ctrl+C to copy';
        }
      });
    }

    // Documents are fetched with the session header, so they cannot be plain links.
    Array.prototype.forEach.call(document.querySelectorAll('[data-download]'), function (link) {
      link.addEventListener('click', async function (event) {
        event.preventDefault();
        var original = link.textContent;
        link.textContent = 'Downloading…';
        try {
          var response = await fetch(link.dataset.download, { headers: headers() });
          if (!response.ok) throw new Error('Download failed');
          var blob = await response.blob();
          var url = URL.createObjectURL(blob);
          var anchor = document.createElement('a');
          anchor.href = url;
          anchor.download = link.dataset.filename;
          document.body.appendChild(anchor);
          anchor.click();
          document.body.removeChild(anchor);
          URL.revokeObjectURL(url);
        } catch (e) {
          alert('Could not download that document. Please try again.');
        }
        link.textContent = original;
      });
    });
  }

  async function saveCase(caseId, updates, button, noteId, successText, keepOpen) {
    var original = button.textContent;
    button.disabled = true;
    button.textContent = 'Saving…';
    try {
      var payload = Object.assign({ action: 'update', id: caseId }, updates);
      if (updates.status) {
        payload.activityEvent = 'status_' + updates.status;
        payload.activityMetadata = { source: 'case_desk' };
      }
      var data = await api('/api/admin/cases', { method: 'PATCH', body: JSON.stringify(payload) });
      var note = el(noteId);
      if (note) {
        note.textContent = successText;
        note.hidden = false;
        setTimeout(function () { note.hidden = true; }, 2500);
      }
      // Refresh the list underneath so lane counts stay honest.
      await loadCases();
      if (!keepOpen && data.case) {
        openCase(caseId);
      }
    } catch (error) {
      var note2 = el(noteId);
      if (note2) {
        note2.textContent = error.message;
        note2.className = 'notice notice-error';
        note2.hidden = false;
      }
    }
    button.disabled = false;
    button.textContent = original;
  }

  async function openCase(caseId) {
    state.selected = caseId;
    el('overlay').classList.add('open');
    el('panel').classList.add('open');
    el('panel').setAttribute('aria-hidden', 'false');
    el('panel-body').innerHTML = '<div class="skeleton">Loading case…</div>';

    try {
      var data = await api('/api/admin/cases?id=' + encodeURIComponent(caseId) + '&sections=core,workflow,comms');
      var record = data.case || {};
      el('panel-title').textContent = record.clientName || 'Case';
      el('panel-sub').textContent = (record.reference || '') + (record.deceasedName ? ' · for ' + record.deceasedName : '');
      renderPanel(record);
    } catch (error) {
      el('panel-body').innerHTML = '<div class="notice notice-error">' + escapeHtml(error.message) + '</div>';
    }
  }

  function closePanel() {
    state.selected = null;
    el('overlay').classList.remove('open');
    el('panel').classList.remove('open');
    el('panel').setAttribute('aria-hidden', 'true');
  }

  async function loadCases() {
    try {
      var data = await api('/api/admin/cases');
      state.cases = Array.isArray(data.cases) ? data.cases : [];
      el('desk-error').hidden = true;
      renderList();
    } catch (error) {
      if (error.status === 401 || error.status === 403) {
        signOut();
        return;
      }
      el('desk-error').textContent = error.message;
      el('desk-error').hidden = false;
    }
  }

  function showDesk(session) {
    state.session = session;
    el('login-view').hidden = true;
    el('desk-view').hidden = false;
    el('refresh-btn').hidden = false;
    el('signout-btn').hidden = false;
    el('session-user').textContent = session && (session.name || session.username) ? (session.name || session.username) : '';
    loadCases();
  }

  function showLogin() {
    el('login-view').hidden = false;
    el('desk-view').hidden = true;
    el('refresh-btn').hidden = true;
    el('signout-btn').hidden = true;
    el('session-user').textContent = '';
  }

  function signOut() {
    if (state.token) {
      api('/api/admin/session', { method: 'DELETE' }).catch(function () { /* already gone */ });
    }
    state.token = '';
    state.session = null;
    state.cases = [];
    writeToken('');
    closePanel();
    showLogin();
  }

  // Events
  el('login-form').addEventListener('submit', async function (event) {
    event.preventDefault();
    var submit = el('login-submit');
    var error = el('login-error');
    error.hidden = true;
    submit.disabled = true;
    submit.textContent = 'Signing in…';
    try {
      var data = await api('/api/admin/session', {
        method: 'POST',
        body: JSON.stringify({
          username: el('login-username').value.trim(),
          password: el('login-password').value
        })
      });
      state.token = data.sessionToken || '';
      writeToken(state.token);
      showDesk(data.session || null);
    } catch (err) {
      error.textContent = err.message;
      error.hidden = false;
    }
    submit.disabled = false;
    submit.textContent = 'Sign in';
  });

  el('signout-btn').addEventListener('click', signOut);
  el('refresh-btn').addEventListener('click', loadCases);
  el('overlay').addEventListener('click', closePanel);
  el('panel-close').addEventListener('click', closePanel);

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && state.selected) closePanel();
  });

  el('case-list').addEventListener('click', function (event) {
    var row = event.target.closest('[data-case-id]');
    if (row) openCase(row.dataset.caseId);
  });

  el('tabs').addEventListener('click', function (event) {
    var tab = event.target.closest('[data-tab]');
    if (!tab) return;
    state.tab = tab.dataset.tab;
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (node) {
      node.classList.toggle('active', node === tab);
    });
    renderList();
  });

  var searchTimer = null;
  el('search').addEventListener('input', function (event) {
    clearTimeout(searchTimer);
    var value = event.target.value;
    searchTimer = setTimeout(function () {
      state.search = value;
      renderList();
    }, 150);
  });

  // Boot: resume an existing session if the stored token is still good.
  (async function boot() {
    state.token = readToken();
    if (!state.token) { showLogin(); return; }
    try {
      var data = await api('/api/admin/session');
      if (data && data.authenticated) {
        showDesk(data.session || null);
      } else {
        signOut();
      }
    } catch (e) {
      signOut();
    }
  })();
})();
</script>
</body>
</html>
